name: CT Pipeline

on:
  push:
    paths:
      - 'data/**'
      - 'src/train.py'
      - 'requirements.txt'
    branches: [ main ]

  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install joblib

      - name: Retrain Model & Update MLflow Registry
        run: |
          rm -f mlflow.db
          rm -rf mlruns
          python src/train.py

      - name: Trigger CI Validation Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref main