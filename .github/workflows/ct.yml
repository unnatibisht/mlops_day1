name: CT Pipeline

on:
  push:
    paths:
      - 'data/**'
      - 'src/train.py'
    branches: [ main ]
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Retrain Model & Update MLflow Registry
        run: |
          rm -f mlflow.db
          rm -rf mlruns
          python src/train.py

      - name: Retrain Model & Update MLflow Registry
        run: |
          python src/train.py

      - name: Trigger CI Validation Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref main
          